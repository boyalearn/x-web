spring:
  session:
    store-type: redis #session存储方式
    redis:
      host: 192.168.0.204
      password:
      port: 6379
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  freemarker:
    #指定HttpServletRequest的属性是否可以覆盖controller的model的同名项
    allow-request-override: false
    #req访问request
    request-context-attribute: req
    #后缀名freemarker默认后缀为.ftl，当然你也可以改成自己习惯的.html
    suffix: .html

    #设置响应的内容类型
    content-type: text/html;charset=utf-8
    #是否允许mvc使用freemarker
    enabled: true
    #是否开启template caching
    cache: false
    #设定模板的加载路径，多个以逗号分隔，默认: [“classpath:/templates/”]
    template-loader-path: classpath:/templates/
    #设定Template的编码
    charset: UTF-8
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://192.168.0.204:3306/x-auth?characterEncoding=UTF-8
          username: root
          password: 12345678
          driver-class-name: com.mysql.jdbc.Driver
mybatis-plus:
  configuration:
    default-enum-type-handler: com.xweb.common.mybatis.NumEnumTypeHandler
server:
  port: 9090
