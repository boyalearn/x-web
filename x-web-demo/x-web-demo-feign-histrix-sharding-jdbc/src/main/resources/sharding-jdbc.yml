dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.jdbc.Driver
    jdbcUrl: jdbc:mysql://localhost:3306/ds_0?serverTimezone=GMT%2B8&useSSL=false&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 12345678
rules:
  - !SHARDING
    tables:
      t_logs:
        actualDataNodes: ds_0.t_logs
        tableStrategy:
          standard:
            shardingColumn: create_time
            shardingAlgorithmName: t-order-inline
        keyGenerateStrategy:
          column: id
          keyGeneratorName: snowflake
        auditStrategy:
          auditorNames:
            - sharding_key_required_auditor
          allowHintDisable: true
    shardingAlgorithms:
      t-order-inline:
        type: USER_CUSTOM
        props:
          aa: bb
    keyGenerators:
      snowflake:
        type: SNOWFLAKE
    auditors:
      sharding_key_required_auditor:
        type: DML_SHARDING_CONDITIONS

props:
  sql-show: false