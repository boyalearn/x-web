spring:
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/x-auth?characterEncoding=UTF-8&serverTimezone=GMT%2B8
          username: root
          password: 12345678
          driver-class-name: com.mysql.jdbc.Driver
mybatis-plus:
  configuration:
    default-enum-type-handler: com.xweb.common.mybatis.NumEnumTypeHandler
server:
  port: 9091
pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql
feign:
  hystrix:
    enabled: true
  httpclient:
    enabled: false
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 10000 #设置hystrix的超时时间为1000ms
      circuitBreaker:
        #在当10秒的时间内，最近10次调用请求，请求错误率超过50%，则触发熔断5秒，期间快速失败，以下都是默认值
        requestVolumeThreshold: 10
        errorThresholdPercentage: 50
        sleepWindowInMilliseconds: 5000
      #设置统计的时间窗口值的毫秒值，circuit break 的打开会根据1个rolling window的统计来计算。
      #若rolling window被设为10000毫秒，则rolling window会被分成n个buckets，
      #每个bucket包含success，failure，timeout，rejection的次数的统计信息。默认10000。
      metrics:
        rollingStats:
          #rolling window大小设置
          timeInMilliseconds: 10000
          #分的buckets的数量
          numBuckets: 10
