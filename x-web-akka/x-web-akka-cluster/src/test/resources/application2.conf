akka {
  # 使用集群模式
    actor {
        provider = "akka.cluster.ClusterActorRefProvider"
    }

   remote.artery {
      enabled = on
      canonical.hostname = "127.0.0.1"
      canonical.port = 2552
    }

  # 种子节点（第一个节点固定端口2551）
  cluster.seed-nodes = ["akka://cluster@127.0.0.1:2551"]

  loglevel = INFO

  # ==================== 核心：服务注册与路由配置 ====================
  actor.deployment {
    /worker-router {
      router = round-robin-group        # 轮询负载均衡
      routees.paths = ["/user/worker"]  # 自动发现集群中所有路径为 /user/worker 的Actor
      cluster {
        enabled = on
        allow-local-routees = on
        use-roles = []
      }
    }
  }
}